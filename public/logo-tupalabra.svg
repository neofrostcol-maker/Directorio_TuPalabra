<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.5" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="150" cy="150" r="142" fill="#F6F1EA" stroke="#262626" stroke-width="3" />
  
  <!-- Church Cross / Person Emblem in dynamic blue with shadow -->
  <g filter="url(#subtle-shadow)">
    <!-- Central Head circle -->
    <circle cx="154" cy="118" r="12.5" fill="none" stroke="#488FA7" stroke-width="8.5" stroke-linecap="round" />
    
    <!-- Vertical curved spine -->
    <path d="M 134 32 C 128 75, 126 120, 137 170 C 144 205, 160 248, 175 272" 
          fill="none" stroke="#488FA7" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Horizontal Cross / Arms swoosh with loop -->
    <path d="M 68 178 C 105 162, 140 152, 160 156 C 172 158, 178 172, 174 200 C 170 228, 158 252, 145 264 C 138 252, 137 205, 135 158 C 125 159, 95 170, 68 178" 
          fill="none" stroke="#488FA7" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
